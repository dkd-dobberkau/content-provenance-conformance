name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    name: Reference implementation and vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: uv sync
      - name: Vectors are up to date
        run: uv run python vectors.py && git diff --exit-code -- ../../vectors
      - name: Tests
        run: uv run pytest
